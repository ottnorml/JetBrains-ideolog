name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel in-progress runs for the same workflow and branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Use minimal permissions by default, grant additional permissions as needed
permissions:
  contents: read
  checks: write  # Required for publishing test results as checks
  pull-requests: write  # Required for publishing test results as PR comments

jobs:
  test:
    name: Test on Java 21
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        # Only write to cache from master branch, PRs use read-only
        cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      
    - name: Run unit tests
      run: ./gradlew test --continue
      
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: '**/build/test-results/**/*.xml'
        check_name: 'Test Results'
        
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          **/build/reports/tests/
          **/build/test-results/
        retention-days: 7
