name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel in-progress runs for the same workflow and branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Use minimal permissions by default, grant additional permissions as needed
permissions:
  contents: read

jobs:
  build:
    name: Build on Java 21
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        # Only write to cache from master branch, PRs use read-only
        cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      
    - name: Build with Gradle
      run: ./gradlew build -x test
