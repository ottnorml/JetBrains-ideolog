name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel in-progress runs for the same workflow and branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Use minimal permissions by default, grant additional permissions as needed
permissions:
  contents: read

jobs:
  build:
    name: Build on Java 21
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'
        # Only write to cache from master branch, PRs use read-only
        cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      
    - name: Verify Gradle version matches wrapper
      run: |
        WRAPPER_VERSION=$(grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\(.*\)-bin.zip/\1/')
        GLOBAL_VERSION=$(gradle --version | grep "^Gradle" | awk '{print $2}')
        echo "Wrapper version: $WRAPPER_VERSION"
        echo "Global version: $GLOBAL_VERSION"
        if [ "$WRAPPER_VERSION" != "$GLOBAL_VERSION" ]; then
          echo "ERROR: Gradle version mismatch!"
          echo "Wrapper version ($WRAPPER_VERSION) does not match global version ($GLOBAL_VERSION)"
          exit 1
        fi
        echo "✓ Gradle versions match"
      
    - name: Build with Gradle
      run: gradle build -x test
